app = "discordmusicbot-k-zztq"
primary_region = "ord"

[build]

[env]
GUILD_ID = "984970543168098324"
RADIO_URL = "https://playerservices.streamtheworld.com/api/livestream-redirect/WKQXFM.mp3"
RADIO_CHANNEL_ID = "985413944514600970"

# Secrets (set once via CLI, never committed):
#   fly secrets set DISCORD_TOKEN=your_token_here

# The bot is a worker, but it also runs a tiny web server (/healthz and the top.gg vote webhook at /topgg).
# auto_stop_machines is OFF so Fly never stops the bot for lack of web traffic.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

[[restart]]
  policy = "always"
  max_retries = 10

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Saved per-server radio settings live on a persistent volume (create it once with:
#   fly volumes create crue_data --size 1 --region ord --app discordmusicbot-k-zztq)
[mounts]
  source = "crue_data"
  destination = "/data"
