app = "discordmusicbot-k-zztq"
primary_region = "ams"

[build]

[env]
GUILD_ID = "985413944514600968"
RADIO_URL = "https://tunein.com/radio/s30358/"
RADIO_CHANNEL_ID = "985413944514600970"

# Secrets (set once via CLI, never committed):
#   fly secrets set DISCORD_TOKEN=your_token_here

[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "60s"
    timeout = "5s"
    path = "/health"
    method = "GET"

[[restart]]
  policy = "always"
  max_retries = 5

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
