app = "discordmusicbot-k-zztq"
primary_region = "ams"

[build]

[env]
GUILD_ID = "985413944514600968"
RADIO_URL = "https://tunein.com/radio/s30358/"
RADIO_CHANNEL_ID = "985413944514600970"

# Secrets (set once via CLI, never committed):
#   fly secrets set DISCORD_TOKEN=your_token_here

# Discord bots are workers — no inbound HTTP needed.
# Removing [http_service] prevents Fly.io from auto-stopping the machine
# when there is no HTTP traffic (the bot stays connected via WebSocket).

[[restart]]
  policy = "always"
  max_retries = 10

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
