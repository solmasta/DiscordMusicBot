app = "discord-music-bot"
primary_region = "ord"

[build]

[env]
# DISCORD_TOKEN must be set as a secret:
#   fly secrets set DISCORD_TOKEN=your_token_here

# No HTTP service — this is a background worker, not a web app.
# Fly keeps it running persistently on the free shared-cpu-1x plan.

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"
